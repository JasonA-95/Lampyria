<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lampyria : Les Sept Lueurs</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#120d1a">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#120d1a;--panel:#221a35;--panel2:#2c2244;--line:#3f3360;--ink:#f3e9d8;--dim:#a99bb8;--ember:#ffb454;--ok:#7fd18b;--bad:#ff7b6b;--blue:#6fb7ff;color-scheme:dark;
--serif:Georgia,'Times New Roman',serif;--sans:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 var(--sans);min-height:100vh;padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0)}
.hide{display:none!important}
button{font:inherit;color:var(--ink);background:var(--panel2);border:1px solid var(--line);border-radius:10px;min-height:44px;padding:6px 12px;cursor:pointer;text-align:left;display:flex;flex-direction:column;justify-content:center;gap:1px}
button:active:not(:disabled){transform:scale(.98)}
button:disabled{opacity:.45;cursor:default}
button .nm{font-weight:600;font-size:14px}button .mt{font-size:12px;color:var(--dim);font-weight:400}
button.on{background:var(--ember);border-color:var(--ember);color:#2a1a08}button.on .mt{color:#5b3b14}
button.pri{background:var(--ember);border-color:var(--ember);color:#2a1a08;align-items:center;text-align:center}button.pri .mt{color:#5b3b14}
button.ghost{background:transparent}
button.danger{border-color:#7a3a3a;color:#ffb0a6}
button.dim{opacity:.5}
.chips{display:inline-flex;gap:4px;flex-wrap:wrap}
.chip{font-size:12px;padding:1px 8px;border-radius:99px;background:#00000040;border:1px solid var(--line);color:var(--ink);white-space:nowrap}
.chip.ok{border-color:#3f7a4a;color:#a8e8b2}.chip.no{border-color:#7a3a3a;color:#ffb0a6}
/* ----- menu ----- */
#menu{display:flex;flex-direction:column;height:100vh;height:100dvh;max-width:720px;margin:0 auto}
#mhead{padding:10px 14px 6px;display:flex;flex-direction:column;gap:6px}
#mhead .top{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
#mhead h1{margin:0;font:700 20px var(--serif);color:var(--ember)}
#mhead .lv{font-size:13px;color:var(--dim)}#mhead .lv b{color:var(--ink)}
.bar{height:6px;border-radius:9px;background:#00000050;overflow:hidden}.bar i{display:block;height:100%;background:var(--ember)}
#tabs{display:flex;gap:4px;padding:0 10px;border-bottom:1px solid var(--line)}
#tabs button{flex:1;min-height:48px;align-items:center;text-align:center;background:transparent;border:0;border-bottom:3px solid transparent;border-radius:8px 8px 0 0;padding:4px 2px;gap:0;position:relative}
#tabs button .ic{font-size:18px;line-height:1}#tabs button .nm{font-size:12px;font-weight:500;color:var(--dim)}
#tabs button.sel{border-bottom-color:var(--ember);background:var(--panel)}#tabs button.sel .nm{color:var(--ember)}
#tabs .dot{position:absolute;top:5px;right:calc(50% - 18px);width:9px;height:9px;border-radius:50%;background:var(--bad);border:2px solid var(--bg)}
#mbody{flex:1;overflow-y:auto;padding:12px 14px 16px;display:flex;flex-direction:column;gap:10px;-webkit-overflow-scrolling:touch}
#mfoot{padding:8px 14px 12px;border-top:1px solid var(--line);background:var(--bg)}
#mfoot button{width:100%}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px}
.card h3{margin:0;font:600 13px var(--sans);color:var(--ember);text-transform:uppercase;letter-spacing:.06em}
.card p{margin:0;color:var(--dim);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{background:#00000030;border-radius:10px;padding:8px;text-align:center}.stat b{display:block;font-size:20px;color:var(--ember)}.stat span{font-size:12px;color:var(--dim)}
.row{display:flex;flex-direction:row;text-align:left;align-items:center;gap:10px;background:#00000030;border:1px solid var(--line);border-radius:10px;padding:8px 10px;width:100%;min-height:52px}
.row .em{font-size:24px;width:32px;text-align:center}.row .tx{flex:1;min-width:0;display:flex;flex-direction:column}
.row .tx .nm{font-weight:600;font-size:14px}.row .tx .mt{font-size:12px;color:var(--dim)}
.row.empty{border-style:dashed;color:var(--dim)}
.row.lock{opacity:.5}
.seg{display:flex;gap:4px}.seg i{flex:1;height:10px;border-radius:4px;background:#00000050}.seg i.f{background:var(--ember)}.seg i.t{background:var(--blue)}
.sp{font-size:13px;color:var(--dim)}.sp b{color:var(--ink)}
.lu{display:flex;flex-direction:row;text-align:left;gap:10px;align-items:center;width:100%;padding:10px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);min-height:56px}
button.lu.on{color:var(--ink);border-color:var(--ember);background:#3a2a22}.lu .tx{flex:1;min-width:0}.lu .nm{font-weight:600}.lu .mt{display:block;font-size:12px;color:var(--dim)}
.lu .sz{font-size:12px;padding:2px 9px;border-radius:99px;background:#00000050;border:1px solid var(--line)}
.set{font-size:12px;color:var(--dim)}.set b{color:var(--ok)}
/* ----- jeu ----- */
#game{width:100%;max-width:960px;margin:0 auto;display:flex;flex-direction:column;align-items:center;padding:6px 4px 14px}
canvas{max-width:100%;touch-action:manipulation;display:block}
#panel{width:min(640px,100%);display:flex;flex-direction:column;gap:6px;margin-top:6px}
#hud{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:14px}
#hud .pv{flex:1;min-width:120px;display:flex;flex-direction:column;gap:2px;font-size:12px;color:var(--dim)}#hud .pv .bar{height:8px}#hud .pv .bar i{background:var(--ok)}
#hud .pip{display:inline-flex;gap:3px;align-items:center;font-size:12px;color:var(--dim)}#hud .pip i{width:10px;height:10px;border-radius:50%;background:#00000060;border:1px solid var(--line)}#hud .pip.pa i.f{background:var(--ember)}#hud .pip.pm i.f{background:var(--blue)}
#hud .tag{font-size:11px;padding:1px 8px;border-radius:99px;background:var(--ember);color:#2a1a08;font-weight:700}
#sayEl{min-height:42px;padding:8px 12px;background:var(--panel);border-left:3px solid var(--ember);border-radius:8px;font-size:14px}
#sayEl .who{font-weight:700;margin-right:6px}
#msgEl{min-height:20px;color:var(--ink);font-size:13px;text-align:center}
#tip{min-height:18px;font-size:12px;color:var(--dim);text-align:center}
#bar{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:6px}
#foot{display:flex;gap:6px}#foot button{flex:1}#foot button.pri{flex:2}
/* ----- fenêtres ----- */
#modal{position:fixed;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;z-index:20;padding:16px}
#mcard{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;width:min(420px,100%);max-height:88vh;overflow-y:auto;display:flex;flex-direction:column;gap:10px}
#mcard h2{margin:0;font:700 20px var(--serif);color:var(--ember)}#mcard p{margin:0;font-size:14px}
.mbtns{display:flex;gap:8px;flex-wrap:wrap}.mbtns button{flex:1;align-items:center;text-align:center;min-width:120px}
.pick{display:flex;flex-direction:column;gap:6px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0));transform:translateX(-50%);background:var(--panel2);border:1px solid var(--ember);border-radius:99px;padding:8px 16px;font-size:14px;z-index:30;max-width:92vw;text-align:center}
@media (orientation:landscape) and (max-height:600px){
#game{flex-direction:row;align-items:flex-start;gap:8px;max-width:none;padding:4px}
#panel{flex:1;min-width:0;width:auto;max-height:calc(100vh - 8px);overflow-y:auto;margin-top:0}
#bar{grid-template-columns:1fr 1fr}
button{min-height:38px;padding:3px 8px}
#sayEl{min-height:34px;padding:5px 8px;font-size:13px}
#mhead{padding:6px 14px 2px}#mhead h1{font-size:16px}
#tabs button{min-height:40px}#tabs button .ic{font-size:15px}
#mfoot{padding:6px 14px}
.grid{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}}
</style></head><body>
<div id="menu" class="hide"><div id="mhead"></div><div id="tabs"></div><div id="mbody"></div><div id="mfoot"></div></div>
<div id="game" class="hide"><div id="cvwrap"><canvas id="c"></canvas></div><div id="panel"><div id="hud"></div><div id="sayEl"></div><div id="msgEl"></div><div id="tip"></div><div id="bar"></div><div id="foot"></div></div></div>
<div id="modal" class="hide"><div id="mcard"></div></div>
<div id="toast" class="hide"></div>
<script src="donnees.js"></script>
<script src="moteur.js"></script>
<script src="etat.js"></script>
<script src="menu.js"></script>
<script src="exploration.js"></script>
<script src="affichage.js"></script>
<script>if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))</script>
</body></html>
