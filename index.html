<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lampyria : Les Sept Lueurs</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#120d1a">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#120d1a;--panel:#1f1830;--ink:#f3e9d8;--dim:#a99bb8;--ember:#ffb454;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{background:var(--bg)}*{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Georgia,'Times New Roman',serif;display:flex;flex-direction:column;align-items:center;padding:10px 8px 24px;min-height:100vh}
h1{margin:4px 0 0;font-size:28px;color:var(--ember)}p.sub{margin:0 0 8px;color:var(--dim);font-size:14px}
#hud{display:flex;flex-wrap:wrap;gap:4px 14px;justify-content:center;font-size:15px;margin-bottom:4px}#hud b{color:var(--ember)}
canvas{max-width:100%;touch-action:manipulation;display:block}
#sayEl{min-height:44px;width:100%;padding:8px 12px;background:var(--panel);border-left:3px solid var(--ember);border-radius:6px;margin:6px 0;font-size:15px}
#msgEl{min-height:22px;color:var(--dim);font-size:14px;text-align:center;margin-bottom:6px}
#bar{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;width:100%}
button{font:inherit;font-size:14px;min-height:44px;padding:6px 12px;border-radius:10px;border:1px solid #4a3d63;background:var(--panel);color:var(--ink);cursor:pointer}
button.on{background:var(--ember);color:#241608;border-color:var(--ember)}button:disabled{opacity:.4;cursor:default}
#setup{width:min(620px,100%);display:none}h2{font-size:15px;color:var(--ember);margin:14px 0 4px;text-align:center}.row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}#hud{display:flex;flex-wrap:wrap;gap:4px 14px;justify-content:center}
button small{display:block;opacity:.75;font-size:12px}
.hide{display:none!important}button.dim{opacity:.4}
#game{width:100%;max-width:960px;display:flex;flex-direction:column;align-items:center}
#panel{width:min(620px,100%)}
#tip,#hint{min-height:36px;font-size:13px;color:var(--dim);margin:0 0 6px;text-align:center}
@media (orientation:landscape) and (max-height:600px){
body{padding:4px}h1,p.sub{display:none}
#game{flex-direction:row;align-items:flex-start;gap:8px;max-width:none}
#panel{flex:1;min-width:0;width:auto;max-height:calc(100vh - 8px);overflow-y:auto}
#bar{display:grid;grid-template-columns:1fr 1fr;gap:6px}
button{min-height:38px;padding:3px 8px;font-size:13px}button small{font-size:11px}
#sayEl{min-height:34px;padding:5px 8px;margin:4px 0;font-size:13px}#msgEl{min-height:18px;font-size:13px;margin-bottom:4px}
#hud{font-size:13px}#setup{width:100%;columns:2;column-gap:14px}#setup section{break-inside:avoid}h2{margin:6px 0 4px}}
</style></head><body>
<h1>Lampyria</h1><p class="sub">Les Sept Lueurs, combat d'essai (v5)</p>
<div id="setup"></div>
<div id="game" class="hide"><div id="cvwrap"><canvas id="c"></canvas></div><div id="panel"><div id="hud"></div><div id="sayEl"></div><div id="msgEl"></div><div id="tip"></div><div id="bar"></div></div></div>
<script src="donnees.js"></script>
<script src="moteur.js"></script>
<script src="affichage.js"></script>
<script>if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))</script>
</body></html>
